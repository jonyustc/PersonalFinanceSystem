# Cache buster: 2026-04-30 - Force clean rebuild with Optional type fixes
# Updated: 2026-04-30 - Git config updated for deployment
services:
  - type: web
    name: personal-finance-api
    runtime: python
    pythonVersion: 3.14
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Apply any pending DB migrations before serving so the running schema always
    # matches the code. Migrations are idempotent (every step uses IF NOT EXISTS),
    # so this is safe to run on every start and fails fast if a migration errors.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14
      # sync: false vars are set once in the Render dashboard. They must be
      # available at RUNTIME (uvicorn reads them), not only at build.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      # Comma-separated OAuth client IDs accepted as the Google ID-token
      # audience (web client ID; add Android/iOS client IDs if they ever
      # appear as `aud`). Google login returns 503 until this is set.
      - key: GOOGLE_CLIENT_IDS
        sync: false
